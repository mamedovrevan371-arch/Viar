<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VR Ana Ekran</title>
<script defer src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<style>
:root{--bg1:#3a3632;--bg2:#0d0c0b;--fg:#fff;--chip:rgba(255,255,255,.16);--acc:#7cc8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a3632;--bg2:#0d0c0b}}
:root[data-theme="dark"]{--bg1:#3a3632;--bg2:#0d0c0b}
html,body{height:100%;margin:0;background:var(--bg2);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:flex}
.eye{position:relative;flex:1;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,var(--bg1),var(--bg2) 70%);background-size:250% 250%}
.eye.b{display:none;border-left:2px solid #000}
body.vr .eye.b{display:block}
.persp{position:absolute;inset:0;perspective:var(--p)}
.world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.tile{position:absolute;width:calc(var(--p)*.14);height:calc(var(--p)*.14);margin:calc(var(--p)*-.07) 0 0 calc(var(--p)*-.07);transform-style:preserve-3d}
.tile.sm{width:calc(var(--p)*.07);height:calc(var(--p)*.07);margin:calc(var(--p)*-.035) 0 0 calc(var(--p)*-.035)}
.ic{width:100%;height:100%;border-radius:24%;display:grid;place-items:center;font-size:calc(var(--p)*.07);font-weight:700;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.45);transition:transform .15s,box-shadow .15s}
.sm .ic{font-size:calc(var(--p)*.035);border-radius:50%;background:rgba(255,255,255,.12);box-shadow:none}
.tile.hot .ic{transform:translateZ(calc(var(--p)*.05)) scale(1.14);box-shadow:0 0 0 3px var(--acc),0 14px 34px rgba(0,0,0,.6)}
.tile.tap .ic{transform:translateZ(calc(var(--p)*.02)) scale(.92)}
.lab{position:absolute;top:104%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:calc(var(--p)*.024);text-shadow:0 1px 4px #000}
.clock{display:grid;place-items:center;font-size:calc(var(--p)*.04);font-weight:600;width:calc(var(--p)*.3);margin-left:calc(var(--p)*-.15)}
.cur{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.22);pointer-events:none;z-index:5;transition:transform .1s,background .1s}
.cur.pinch{background:var(--acc);transform:scale(.7)}
.cur.dw{background:conic-gradient(var(--acc) calc(var(--d)*1turn),rgba(255,255,255,.2) 0)}
.toast{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);padding:8px 16px;border-radius:99px;background:rgba(0,0,0,.65);font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
#hud{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px;z-index:20}
#hud button{border:0;border-radius:99px;padding:9px 14px;font-size:13px;color:var(--fg);background:var(--chip);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#hud button.on{background:var(--acc);color:#001}
#status{position:fixed;left:50%;transform:translateX(-50%);top:calc(6px + env(safe-area-inset-top,0px));font-size:12px;padding:4px 12px;border-radius:99px;background:var(--chip);z-index:20;pointer-events:none}
video{display:none}
</style>
</head>
<body>
<div id="stage">
  <div class="eye a"><div class="persp"><div class="world"></div></div></div>
  <div class="eye b"><div class="persp"><div class="world"></div></div></div>
</div>
<div id="status">Mouse/toxunuşla baxın, ya da düymələri aktivləşdirin</div>
<div id="hud">
  <button id="bHand">🖐 Əl izləmə</button>
  <button id="bGyro">🧭 Giroskop</button>
  <button id="bVr">🥽 VR rejimi</button>
  <button id="bCen">⌖ Mərkəzlə</button>
</div>
<video id="cam" playsinline muted></video>
<script>
(function(){
var D=180/Math.PI;
var ROWS=[
 {p:16,y:[-21.75,-7.25,7.25,21.75],a:[["Store","🛍","linear-gradient(#f7b04a,#e8703a)",1],["Feed","📰","linear-gradient(#5aa2f0,#3a6fd0)",1],["Chats","💬","linear-gradient(#c15be6,#8a3fc8)",1],["Browser","🧭","linear-gradient(#8a96f0,#5a62c8)",1]]},
 {p:0,y:[-29,-14.5,0,14.5,29],a:[["Help & Tips","📖","linear-gradient(#5aa88a,#2f7a62)",1],["TV","▶","linear-gradient(#d23be0,#8a2fc8)"],["Facebook","f","#1877f2"],["Instagram","📷","linear-gradient(45deg,#fcb045,#fd1d1d,#833ab4)"],["WhatsApp","📞","#25d366"]]},
 {p:-16,y:[-21.75,-7.25,7.25,21.75],a:[["Messenger","✉","linear-gradient(#2a8cff,#1a4fe0)"],["Remote Desktop","🖥","linear-gradient(#9a8ff0,#6a5fc0)"],["Asgard’s Wrath 2","⚔","linear-gradient(#2a4a90,#c8a040)"],["Beat Saber","♪","linear-gradient(90deg,#e03a4a,#2a5aff)"]]}
];
var items=[];
ROWS.forEach(function(r){r.a.forEach(function(a,i){items.push({n:a[0],g:a[1],c:a[2],pin:a[3],y:r.y[i],p:r.p})})});
["🙂","⌂","◍","▦","👥","⚙","🔔"].forEach(function(g,i){items.push({n:"",g:g,sm:1,y:(i-3)*6.67,p:-36})});
items.push({clock:1,y:0,p:36});

var eyes=[].slice.call(document.querySelectorAll(".eye")),tiles=[],curs=[],toasts=[],worlds=[],clocks=[];
eyes.forEach(function(e,k){
  var w=e.querySelector(".world");worlds.push(w);tiles[k]=[];
  items.forEach(function(it){
    var d=document.createElement("div");d.className="tile"+(it.sm?" sm":"")+(it.clock?" clock":"");
    d.style.transform="rotateY("+(-it.y)+"deg) rotateX("+(-it.p)+"deg) translateZ(calc(var(--p)*-1))";
    if(it.clock){clocks.push(d)}
    else d.innerHTML='<div class="ic" style="background:'+it.c+'">'+it.g+'</div>'+(it.sm?'':'<span class="lab">'+(it.pin?'📌 ':'')+it.n+'</span>');
    w.appendChild(d);tiles[k].push(d);
  });
  var c=document.createElement("div");c.className="cur";e.appendChild(c);curs.push(c);
  var t=document.createElement("div");t.className="toast";e.appendChild(t);toasts.push(t);
});
function tick(){var s=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});clocks.forEach(function(c){c.textContent=s})}
tick();setInterval(tick,5000);

var view={y:0,p:0},target={y:0,p:0},ptr={x:.5,y:.5,pinch:false},mouse={x:.5,y:.5};
var gyro=false,yawOff=null,rawYaw=0,lastHand=0,mirror=true,hot=-1,wasPinch=false,dw={i:-1,t:0},vr=false;
function wrap(a){return ((a+540)%360)-180}
function status(s){document.getElementById("status").textContent=s}

function resize(){eyes.forEach(function(e){e.style.setProperty("--p",(e.clientHeight*.95)+"px")})}
addEventListener("resize",resize);resize();

var toastTimer;
function activate(i){
  if(i<0)return;var it=items[i];if(it.clock)return;
  try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
  tiles.forEach(function(t,k){var el=t[i];el.classList.add("tap");setTimeout(function(){el.classList.remove("tap")},180);
    toasts[k].textContent=it.n?("▶ "+it.n+" açılır…"):"Menyu";toasts[k].classList.add("on")});
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){toasts.forEach(function(t){t.classList.remove("on")})},1600);
}

/* Gyroscope */
function onOri(e){
  if(e.alpha==null)return;
  var a=e.alpha/D,b=e.beta/D,g=e.gamma/D;
  var x=-Math.sin(g)*Math.cos(a)-Math.cos(g)*Math.sin(b)*Math.sin(a);
  var y=-Math.sin(g)*Math.sin(a)+Math.cos(g)*Math.sin(b)*Math.cos(a);
  var z=-Math.cos(g)*Math.cos(b);
  rawYaw=Math.atan2(x,y)*D;
  if(yawOff==null)yawOff=rawYaw;
  target.y=wrap(rawYaw-yawOff);
  target.p=Math.max(-70,Math.min(70,Math.asin(Math.max(-1,Math.min(1,z)))*D));
}
function gyroOn(){
  var go=function(){addEventListener("deviceorientation",onOri);gyro=true;document.getElementById("bGyro").classList.add("on");status("Giroskop aktivdir")};
  try{
    if(typeof DeviceOrientationEvent!=="undefined"&&DeviceOrientationEvent.requestPermission){
      DeviceOrientationEvent.requestPermission().then(function(r){r==="granted"?go():status("Giroskop icazəsi verilmədi")}).catch(function(){status("Giroskop xətası")});
    }else go();
  }catch(e){status("Giroskop dəstəklənmir")}
}
document.getElementById("bGyro").onclick=function(){
  if(gyro){removeEventListener("deviceorientation",onOri);gyro=false;this.classList.remove("on");status("Giroskop söndürüldü")}else gyroOn();
};
document.getElementById("bCen").onclick=function(){yawOff=rawYaw;target.y=0;target.p=0;view.y=0;view.p=0;status("Mərkəzləndi")};

/* Hand tracking */
var handsOn=false,video=document.getElementById("cam");
function onHands(r){
  var L=r.multiHandLandmarks&&r.multiHandLandmarks[0];if(!L)return;
  var x=mirror?1-L[8].x:L[8].x,y=L[8].y;
  x=Math.max(0,Math.min(1,.5+(x-.5)*1.4));y=Math.max(0,Math.min(1,.5+(y-.5)*1.4));
  ptr.x+=(x-ptr.x)*.4;ptr.y+=(y-ptr.y)*.4;
  var d=Math.hypot(L[4].x-L[8].x,L[4].y-L[8].y)/Math.hypot(L[0].x-L[9].x,L[0].y-L[9].y);
  ptr.pinch=ptr.pinch?d<.5:d<.3;
  if(ptr.pinch&&!wasPinch)activate(hot);
  wasPinch=ptr.pinch;lastHand=performance.now();
}
document.getElementById("bHand").onclick=function(){
  var btn=this;if(handsOn)return;
  if(typeof Hands==="undefined"){status("Əl izləmə kitabxanası yüklənmədi");return}
  status("Kamera açılır…");
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:640,height:480},audio:false}).then(function(s){
    video.srcObject=s;mirror=s.getVideoTracks()[0].getSettings().facingMode!=="environment";
    return video.play();
  }).then(function(){
    var h=new Hands({locateFile:function(f){return "https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/"+f}});
    h.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.5});
    h.onResults(onHands);handsOn=true;btn.classList.add("on");status("Əlinizi kameraya göstərin · çimdik = klik");
    (function loop(){if(video.readyState>=2){h.send({image:video}).catch(function(){})}requestAnimationFrame(loop)})();
  }).catch(function(){status("Kameraya icazə verilmədi və ya əl modeli yüklənmədi")});
};

/* VR mode */
document.getElementById("bVr").onclick=function(){
  vr=!vr;document.body.classList.toggle("vr",vr);this.classList.toggle("on",vr);
  if(vr){try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}
    try{screen.orientation.lock("landscape").catch(function(){})}catch(e){}
    status("VR: nəzərlə seçin (1.3 san) və ya əl çimdiyi");
  }else{try{document.exitFullscreen&&document.exitFullscreen()}catch(e){}}
  setTimeout(resize,150);
};

/* Mouse / touch */
var st=document.getElementById("stage"),down=null,moved=false;
st.addEventListener("pointerdown",function(e){down={x:e.clientX,y:e.clientY};moved=false});
st.addEventListener("pointermove",function(e){
  var W=eyes[0].clientWidth;mouse.x=(e.clientX%W)/W;mouse.y=e.clientY/eyes[0].clientHeight;
  if(down&&!gyro){var dx=e.clientX-down.x,dy=e.clientY-down.y;
    if(Math.abs(dx)+Math.abs(dy)>4)moved=true;
    target.y=wrap(target.y-dx*.2);target.p=Math.max(-70,Math.min(70,target.p+dy*.2));down={x:e.clientX,y:e.clientY};}
});
st.addEventListener("pointerup",function(){if(!moved&&!vr)activate(hot);down=null});

/* Render loop */
var last=performance.now();
function frame(now){
  var dt=(now-last)/1000;last=now;
  view.y=wrap(view.y+wrap(target.y-view.y)*.3);view.p+=(target.p-view.p)*.3;
  var E=eyes[0],W=E.clientWidth,H=E.clientHeight,P=H*.95;
  var src=(now-lastHand<600)?"hand":(vr?"gaze":"mouse");
  var px=.5,py=.5;
  if(src==="hand"){px=ptr.x;py=ptr.y;
    if(!gyro){if(px<.12)target.y=wrap(target.y-1.5);else if(px>.88)target.y=wrap(target.y+1.5);
      if(py<.1)target.p=Math.min(70,target.p+1);else if(py>.9)target.p=Math.max(-70,target.p-1)}
  }else if(src==="mouse"){px=mouse.x;py=mouse.y}
  var ay=view.y+Math.atan((px-.5)*W/P)*D,ap=view.p-Math.atan((py-.5)*H/P)*D;
  var best=-1,bd=1e9;
  items.forEach(function(it,i){if(it.clock)return;
    var dy=wrap(ay-it.y)*Math.cos(it.p/D),dp=ap-it.p,d=Math.hypot(dy,dp),th=it.sm?3.4:5.5;
    if(d<th&&d<bd){bd=d;best=i}});
  if(best!==hot){tiles.forEach(function(t){if(hot>=0)t[hot].classList.remove("hot");if(best>=0)t[best].classList.add("hot")});hot=best}
  var prog=0;
  if(src==="gaze"&&hot>=0){
    if(dw.i!==hot){dw.i=hot;dw.t=0}
    if(dw.t>=0){dw.t+=dt;prog=Math.min(1,dw.t/1.3);if(dw.t>=1.3){activate(hot);dw.t=-1}}
  }else{dw.i=-1;dw.t=0}
  eyes.forEach(function(e,k){
    worlds[k].style.transform="rotateX("+view.p+"deg) rotateY("+view.y+"deg)";
    e.style.backgroundPosition=(50-view.y*.5)+"% "+(50+view.p*.5)+"%";
    var c=curs[k];c.style.left=(px*e.clientWidth)+"px";c.style.top=(py*e.clientHeight)+"px";
    c.classList.toggle("pinch",src==="hand"&&ptr.pinch);
    c.classList.toggle("dw",prog>0);c.style.setProperty("--d",prog);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
